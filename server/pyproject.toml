[project]
name = "BlueSend-Server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "keyboard>=0.13.5",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pystray>=0.19.5",
    "pywin32>=312",
    "rich>=15.0.0",
    "winrt-runtime>=3.2",
    "winrt-Windows.Devices.Bluetooth>=3.2",
    "winrt-Windows.Devices.Bluetooth.GenericAttributeProfile>=3.2",
    "winrt-Windows.Foundation>=3.2",
    "winrt-Windows.Storage.Streams>=3.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
