<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手机 ↔ 电脑 蓝牙通道</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>

  <div class="card">
    <!-- 头部紧凑控制栏 -->
    <div class="top-bar">
      <div class="left-controls">
        <span id="status" class="status-badge disconnected">未连接</span>
        <button id="connect-btn" class="btn-connect">扫描连接</button>
      </div>
      
      <!-- 即时输入 Switch 开关 -->
      <div class="switch-container">
        <span>即时发送</span>
        <label class="switch">
          <input type="checkbox" id="instant-switch" checked onchange="toggleInstantMode()">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- 最近一次链路事件（连接/断开/重连），同时会补发到电脑端日志 -->
    <div id="event-log" class="event-log">尚未连接</div>

    <!-- 输入区 -->
    <textarea id="text-input" placeholder="连接蓝牙后可开始输入..."></textarea>

    <!-- 经典模式发送/清空按钮组（即时发送模式下会自动隐藏） -->
    <div id="btn-group" class="button-group" style="display: none;">
      <button id="send-btn" class="btn btn-send" onclick="sendText()" disabled>发送 (Ctrl+Enter)</button>
      <button class="btn btn-clear" onclick="clearInput()">清空</button>
    </div>

    <!-- 剪贴板同步按钮组 -->
    <div class="clipboard-group">
      <button class="btn btn-pull" onclick="pullClipboard()">拉取剪贴板</button>
      <button class="btn btn-push" onclick="pushClipboard()">推送剪贴板</button>
    </div>
  </div>

  <!-- 引入核心 JavaScript 逻辑 -->
  <script src="static/app.js"></script>
</body>
</html>
