<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http://www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%20%3Cdefs%3E%20%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%2232%22%20y2%3D%2232%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%236366F1%22/%3E%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%231E1B4B%22/%3E%20%3C/linearGradient%3E%20%3C/defs%3E%20%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22url(%23g)%22/%3E%20%3Cg%20transform%3D%22translate(16%2016)%20scale(.06875)%20translate(-256%20-256)%22%3E%20%3Cpath%20d%3D%22M420%2088%20L150%20186%20L286%20240%20Z%22%20fill%3D%22%23FFFFFF%22/%3E%20%3Cpath%20d%3D%22M420%2088%20L286%20240%20L232%20364%20Z%22%20fill%3D%22%23818CF8%22/%3E%20%3C/g%3E%20%3C/svg%3E">
<title>发送文件到电脑</title>
<style>
  :root {
    --text-color: #f4f4f7;
    --text-muted: #9aa0ae;
    --primary-color: #6366f1;
    --success-color: #10b981;
    --error-color: #ef4444;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC',
      'MiSans', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(900px 620px at 12% -12%, rgba(99, 102, 241, 0.3), transparent 62%),
      radial-gradient(760px 520px at 112% 112%, rgba(168, 85, 247, 0.2), transparent 60%),
      linear-gradient(180deg, #0c0c14, #09090e 70%);
    color: var(--text-color);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 20px 14px;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    width: 100%;
    max-width: 460px;
    margin-top: 10px;
    padding: 20px 20px 16px;
    background: linear-gradient(180deg, rgba(32, 32, 46, 0.78), rgba(17, 17, 26, 0.92));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.075);
    border-radius: 22px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  h1 {
    font-size: 17px;
    font-weight: 600;
  }

  .targets {
    display: flex;
    gap: 22px;
    margin-top: 14px;
  }

  .target {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 0;
    border: 0;
    background: none;
    font: inherit;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.15s ease;
  }

  .target::before {
    content: '';
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.28);
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .target.active {
    color: var(--text-color);
  }

  .target.active::before {
    border-color: var(--primary-color);
    background: radial-gradient(circle, var(--primary-color) 0 4px, transparent 4.5px);
  }

  .pick {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 30px;
    height: 52px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: #aab3ff;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.28);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }

  .pick:hover {
    background: rgba(99, 102, 241, 0.2);
    border-color: rgba(99, 102, 241, 0.5);
  }

  .pick:active {
    transform: scale(0.985);
  }

  .list {
    margin-top: 16px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .item {
    padding: 12px 14px;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 14px;
  }

  .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-size: 12.5px;
  }

  .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .size {
    flex: none;
    font-size: 11px;
    color: var(--text-muted);
  }

  .bar {
    height: 4px;
    margin-top: 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  .fill {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--primary-color), #a855f7);
    transition: width 0.2s ease;
  }

  .item.failed .fill {
    background: var(--error-color);
  }

  .status {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .status.failed {
    color: var(--error-color);
  }

  .summary {
    margin-top: 16px;
    font-size: 11.5px;
    color: var(--success-color);
  }

  .summary:empty {
    display: none;
  }

  /* 底部的语言开关：与主页面同一套弱化文字按钮 */
  .footer {
    margin-top: auto;
    padding-top: 18px;
    padding-bottom: env(safe-area-inset-bottom);
    text-align: center;
  }

  .lang-switch {
    display: block;
    margin: 0 auto;
    padding: 0;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    color: #9d8fc2;
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.18s;
  }

  .lang-switch:hover { opacity: 1; }

  /* 行高必须显式给：line-height: normal 会按字体自身度量取值，中文与拉丁字母
     的行盒高度不同，切换语言时元素高度会跳。1.45 与中文下的自然行高一致。 */
  h1,
  .target,
  .pick,
  .meta,
  .status,
  .summary,
  .footer,
  .lang-switch {
    line-height: 1.45;
  }
</style>
</head>
<body>
<main>
  <h1 data-i18n="title"></h1>

  <div class="targets">
    <button type="button" class="target" data-target="desktop" data-i18n="desktop"></button>
    <button type="button" class="target active" data-target="downloads" data-i18n="downloads"></button>
  </div>

  <label class="pick">
    <span data-i18n="pick"></span>
    <input id="picker" type="file" multiple hidden>
  </label>

  <ul id="list" class="list"></ul>
  <p id="summary" class="summary"></p>
</main>

<footer class="footer">
  <button id="lang" class="lang-switch" type="button"></button>
</footer>

<script>
  const MESSAGES = {
    zh: {
      title: '发送文件到电脑',
      localeName: '中文',
      switchAria: '切换语言',
      desktop: '桌面',
      downloads: '下载',
      pick: '选择文件',
      waiting: '等待中',
      uploading: '上传中…',
      uploadingPercent: '上传中 {percent}%',
      done: '完成',
      stallFailed: '失败：长时间没有进度',
      networkFailed: '失败：网络中断',
      abortedFailed: '失败：传输已中断',
      failedWith: '失败：{message}',
      summaryFailed: '已结束：完成 {done} 个，失败 {failed} 个',
      summaryAll: '全部完成，共 {done} 个文件',
    },
    en: {
      title: 'Send files to PC',
      localeName: 'English',
      switchAria: 'Switch language',
      desktop: 'Desktop',
      downloads: 'Downloads',
      pick: 'Choose files',
      waiting: 'Waiting',
      uploading: 'Uploading…',
      uploadingPercent: 'Uploading {percent}%',
      done: 'Done',
      stallFailed: 'Failed: no progress for too long',
      networkFailed: 'Failed: network error',
      abortedFailed: 'Failed: transfer aborted',
      failedWith: 'Failed: {message}',
      summaryFailed: 'Finished: {done} done, {failed} failed',
      summaryAll: 'All done — {done} file(s)',
    },
  };

  // 语言只跟随系统（浏览器语言），底部按钮可临时切换，不持久化。
  let locale = navigator.languages.some((lang) => lang.toLowerCase().startsWith('zh'))
    ? 'zh'
    : 'en';

  function t(key, params = {}) {
    return MESSAGES[locale][key].replace(
      /\{(\w+)\}/g,
      (_, name) => params[name],
    );
  }

  const langButton = document.getElementById('lang');

  function applyStatic() {
    document.documentElement.lang = locale === 'zh' ? 'zh-CN' : 'en';
    document.title = t('title');
    for (const el of document.querySelectorAll('[data-i18n]')) {
      el.textContent = t(el.dataset.i18n);
    }
    langButton.textContent = t('localeName');
    langButton.setAttribute('aria-label', t('switchAria'));
  }

  langButton.addEventListener('click', () => {
    locale = locale === 'zh' ? 'en' : 'zh';
    applyStatic();
  });

  applyStatic();

  const token = new URLSearchParams(location.search).get('t') || '';
  const picker = document.getElementById('picker');
  const list = document.getElementById('list');
  const summary = document.getElementById('summary');
  const targetButtons = document.querySelectorAll('.target');

  let target = 'downloads';

  for (const button of targetButtons) {
    button.addEventListener('click', () => {
      target = button.dataset.target;
      for (const other of targetButtons) {
        other.classList.toggle('active', other === button);
      }
    });
  }

  const queue = [];
  let running = false;
  let done = 0;
  let failed = 0;

  picker.addEventListener('change', () => {
    for (const file of picker.files) {
      queue.push({ file, row: addRow(file) });
    }
    picker.value = '';
    run();
  });

  async function run() {
    if (running) return;
    running = true;
    done = 0;
    failed = 0;
    summary.textContent = '';
    while (queue.length) {
      await upload(queue.shift());
    }
    running = false;
    summary.textContent = failed
      ? t('summaryFailed', { done, failed })
      : t('summaryAll', { done });
  }

  // 半开连接（换 WiFi、电脑睡眠）下 xhr 既不 onload 也不 onerror，队列会永远
  // 停在这个文件上。按「多久没有进度」判死，而不是限制总时长——大文件本就慢。
  const STALL_TIMEOUT_MS = 30000;

  function upload({ file, row }) {
    return new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      let timer = null;
      let settled = false;

      function settle(ok, text) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (ok) done += 1;
        else failed += 1;
        setRow(row, ok ? 1 : null, text);
        resolve();
      }

      function pet() {
        clearTimeout(timer);
        timer = setTimeout(() => {
          xhr.abort();
          settle(false, t('stallFailed'));
        }, STALL_TIMEOUT_MS);
      }

      // 只影响还没开始的文件：请求头在这里就定下了，切换按钮不会改动已发出的请求。
      xhr.open('POST', '/upload?t=' + encodeURIComponent(token));
      xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
      xhr.setRequestHeader('X-Target', target);
      xhr.upload.onprogress = (event) => {
        pet();
        if (!event.lengthComputable) return;
        const ratio = event.loaded / event.total;
        setRow(row, ratio, t('uploadingPercent', { percent: Math.floor(ratio * 100) }));
      };
      xhr.onload = () => {
        let body = {};
        try {
          body = JSON.parse(xhr.responseText);
        } catch {
          // 非 JSON 响应只可能是服务端的错误页，按状态码报。
        }
        if (xhr.status === 200 && body.ok) {
          settle(true, t('done'));
        } else {
          settle(false, t('failedWith', { message: body.error || 'HTTP ' + xhr.status }));
        }
      };
      xhr.onerror = () => settle(false, t('networkFailed'));
      xhr.onabort = () => settle(false, t('abortedFailed'));
      setRow(row, 0, t('uploading'));
      pet();
      xhr.send(file);
    });
  }

  function addRow(file) {
    const item = document.createElement('li');
    item.className = 'item';

    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = file.name;
    const size = document.createElement('span');
    size.className = 'size';
    size.textContent = formatSize(file.size);
    meta.append(name, size);

    const bar = document.createElement('div');
    bar.className = 'bar';
    const fill = document.createElement('div');
    fill.className = 'fill';
    bar.append(fill);

    const status = document.createElement('div');
    status.className = 'status';
    status.textContent = t('waiting');

    item.append(meta, bar, status);
    list.append(item);
    return { item, fill, status };
  }

  function setRow(row, ratio, text) {
    row.status.textContent = text;
    if (ratio === null) {
      row.item.classList.add('failed');
      row.status.classList.add('failed');
      return;
    }
    row.fill.style.width = (ratio * 100).toFixed(1) + '%';
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
  }
</script>
</body>
</html>
